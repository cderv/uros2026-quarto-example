# Brand of a FICTIONAL statistics institute, for the example bulletin only.
# The data are real (Eurostat); the publisher is not.
meta:
  name:
    full: Northbridge Statistical Office
    short: NSO
  link: https://example.org

logo:
  images:
    mark:
      path: brand/nso-mark.svg
      alt: Northbridge Statistical Office logo, three gold bars on a burgundy square
    full:
      path: brand/nso-logo.svg
      alt: Northbridge Statistical Office
  small: mark
  medium: full
  large: full

color:
  palette:
    burgundy: "#7a1f3d"
    gold: "#c9a227"
    ink: "#2b2b2b"
    stone: "#f6f3ee"
    slate: "#5f6368"
    # Five classes of yearly change, from strongest fall (drop) to strongest rise (surge)
    # drop and surge are dark enough for white text (contrast 10.0 and 5.1)
    drop: "#7a1f3d"
    dip: "#c48a9e"
    flat: "#eadbb0"
    gain: "#d9b95a"
    surge: "#8a6a12"
    red: burgundy
    yellow: gold
    gray: slate
  primary: burgundy
  secondary: slate
  warning: gold
  foreground: ink
  background: "#ffffff"
  light: stone

typography:
  fonts:
    - family: Source Sans 3
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: Source Serif 4
      source: google
      weight: [600, 700]
    - family: Source Code Pro
      source: google
      weight: [400]
  base:
    family: Source Sans 3
    line-height: 1.5
  headings:
    family: Source Serif 4
    weight: 600
    color: burgundy
  monospace: Source Code Pro
  link:
    color: burgundy
