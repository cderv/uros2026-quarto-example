<header id="title-block-header" class="quarto-title-block default$if(quarto-template-params.banner-header-class)$ $quarto-template-params.banner-header-class$$endif$">
  <div class="quarto-title-banner">
    <div class="quarto-title column-body">
      <img class="nso-logo" src="brand/nso-logo.svg" alt="Northbridge Statistical Office">
      $if(title)$<h1 class="title">$title$</h1>$endif$
      $if(subtitle)$
      <p class="subtitle lead">$subtitle$</p>
      $endif$
    </div>
  </div>

  $title-metadata.html()$

  <!-- Phones and tablets: Quarto hides the left sidebar (formats, code links) below 992px -->
  <nav class="nso-small-links d-lg-none column-body" aria-label="Other formats and source">
    <a href="bulletin.pdf"><i class="bi bi-file-pdf" aria-hidden="true"></i> PDF</a>
    <a href="bulletin.docx"><i class="bi bi-file-word" aria-hidden="true"></i> Word</a>
    <a href="https://github.com/cderv/uros2026-quarto-example"><i class="bi bi-github" aria-hidden="true"></i> Source on GitHub</a>
  </nav>

</header>
